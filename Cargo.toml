[workspace]
resolver = "2"
members = ["interface", "engine", "cloud"]
# The synthetic test program has its own SBF toolchain and lockfile.
exclude = ["programs/fixture-lending"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
fixture-lending-interface = { path = "interface" }
borsh = { version = "1.5", features = ["derive"] }

# Match the types exposed by LiteSVM's public API.
litesvm = "0.16"
solana-account = "4.3.0"
solana-address = "2.6.1"
solana-clock = "3.1.1"
solana-hash = "4.5.0"
solana-instruction = "3.4.0"
solana-keypair = "3.1.2"
solana-message = "4.2.4"
solana-rent = "4.3.0"
solana-signer = "3.0.1"
solana-transaction = "4.1.5"
solana-transaction-error = "3.3.1"
solana-instruction-error = "2.4.0"

anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
overflow-checks = true

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
