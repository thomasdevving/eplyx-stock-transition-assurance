[package]
name = "eplyx-demo-conversion"
version = "0.1.0"
edition = "2021"
description = "Eplyx Demo Candidate Conversion: a repository-registered candidate old-token to replacement-token mechanism used to pre-flight an operator-supplied conversion plan. Not an issuer mechanism and not deployed on any cluster."
license = "MIT"

# Own workspace root: built for the SBF target by cargo-build-sbf, separately
# from the host-side engine workspace, exactly like the lending fixture.
[workspace]

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = []
custom-heap = []
custom-panic = []
no-entrypoint = []

[dependencies]
solana-program = "4.1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }

[profile.release]
overflow-checks = true
codegen-units = 1
