[package]
name = "eplyx-cloud"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optional hosted Eplyx workspace: synced run metadata, counterexamples and comparisons. Executes nothing."
publish = false

[[bin]]
name = "eplyx-cloud"
path = "src/main.rs"

[dependencies]
eplyx-lifecycle-impact = { path = "../engine" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
deadpool-postgres = "0.14"
argon2 = "0.5"
getrandom = "0.3"
base64 = "0.22.1"
sha2 = "0.10.9"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies", "blocking"] }
