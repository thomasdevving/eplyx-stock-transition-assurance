[package]
name = "eplyx-lifecycle-impact"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Change scenarios, state diffs and economic impact for Eplyx Lifecycle Impact."
default-run = "eplyx-lifecycle"

[[bin]]
name = "eplyx-lifecycle"
path = "src/main.rs"

[[bin]]
name = "eplyx"
path = "src/bin/eplyx.rs"

[dependencies]
fixture-lending-interface = { workspace = true }
borsh = { workspace = true }
litesvm = { workspace = true }
solana-account = { workspace = true }
solana-address = { workspace = true, features = ["curve25519", "std"] }
solana-clock = { workspace = true }
solana-hash = { workspace = true }
solana-instruction = { workspace = true }
solana-keypair = { workspace = true }
solana-message = { workspace = true }
solana-rent = { workspace = true }
solana-signer = { workspace = true }
solana-transaction = { workspace = true }
solana-transaction-error = { workspace = true }
solana-instruction-error = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
base64 = "0.22.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
solana-program-pack = "3.1"
spl-token-2022-interface = { version = "3.1.1", features = ["serde"] }
spl-token-group-interface = "0.7.2"
spl-token-metadata-interface = "1.0"
sha2 = "0.10.9"
toml_edit = { version = "0.25.15", default-features = false, features = ["parse"] }
